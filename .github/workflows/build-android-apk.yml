name: Build Android

# Alur rilis:
# - push ke build/android-apk  -> APK uji coba (ditandatangani kunci debug)
# - push ke main               -> APK + AAB bertanda tangan rilis, AAB dikirim ke Play Store,
#                                 lalu judul/deskripsi toko disinkronkan dari play/listing/
# - tag android-vX.Y.Z         -> APK bertanda tangan rilis, diunggah ke Google Drive
on:
  workflow_dispatch:
  push:
    branches:
      - build/android-apk
      - main
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.38.5'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build APK for testing
        if: github.ref_type != 'tag' && github.ref != 'refs/heads/main'
        run: flutter build apk --release --no-pub

      - name: Build APK and AAB signed with the release keystore
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: bash
        env:
          TOPAN_ANDROID_KEYSTORE_B64: ${{ secrets.TOPAN_ANDROID_KEYSTORE_B64 }}
          TOPAN_ANDROID_STORE_PASSWORD: ${{ secrets.TOPAN_ANDROID_STORE_PASSWORD }}
          TOPAN_ANDROID_KEY_ALIAS: ${{ secrets.TOPAN_ANDROID_KEY_ALIAS }}
          TOPAN_ANDROID_KEY_PASSWORD: ${{ secrets.TOPAN_ANDROID_KEY_PASSWORD }}
        run: |
          version_args=(--build-number="$GITHUB_RUN_NUMBER")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Use a release tag such as android-v1.0.1"
              exit 1
            fi
            version_args+=(--build-name="${GITHUB_REF_NAME#android-v}")
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            # Versi otomatis: MAJOR.MINOR dari pubspec.yaml + nomor run, mis. 1.0.23.
            base="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)"
            : "${base:?Could not read version from pubspec.yaml}"
            version_args+=(--build-name="$base.$GITHUB_RUN_NUMBER")
            echo "Version name: $base.$GITHUB_RUN_NUMBER (code $GITHUB_RUN_NUMBER)"
          fi
          : "${TOPAN_ANDROID_KEYSTORE_B64:?Set the release keystore secret}"
          : "${TOPAN_ANDROID_STORE_PASSWORD:?Set the keystore password secret}"
          : "${TOPAN_ANDROID_KEY_ALIAS:?Set the release key alias secret}"
          : "${TOPAN_ANDROID_KEY_PASSWORD:?Set the release key password secret}"
          export TOPAN_ANDROID_KEYSTORE
          TOPAN_ANDROID_KEYSTORE="$(mktemp "$RUNNER_TEMP/topan-release.XXXXXX")"
          trap 'rm -f "$TOPAN_ANDROID_KEYSTORE"' EXIT
          base64 --decode <<< "$TOPAN_ANDROID_KEYSTORE_B64" > "$TOPAN_ANDROID_KEYSTORE"
          unset TOPAN_ANDROID_KEYSTORE_B64
          flutter build apk --release --no-pub "${version_args[@]}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            flutter build appbundle --release --no-pub "${version_args[@]}"
          fi

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/app/outputs/flutter-apk/app-release.apk'

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topan-tracking-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload AAB for Google Play
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topan-tracking-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          compression-level: 0

  publish-play:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: topan-android-play-release
      cancel-in-progress: false

    steps:
      - name: Check Google Play credentials
        id: creds
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          JSON_IN_VARIABLES: ${{ vars.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          if [[ "$JSON_IN_VARIABLES" == "true" ]]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is stored as a plain Variable, which anyone with read access can see. Move it to Settings > Secrets and variables > Actions > Secrets, then delete the Variable."
          fi
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::warning::The PLAY_SERVICE_ACCOUNT_JSON secret is not set; skipping the Google Play upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out store listing and release notes
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare release notes
        if: steps.creds.outputs.ready == 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Catatan rilis yang tidak diubah sejak rilis sebelumnya diganti teks umum,
          # supaya pengguna tidak melihat catatan lama berulang-ulang.
          notes=play/whatsnew/whatsnew-id
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --quiet "$BEFORE" HEAD -- "$notes"; then
            printf '%s\n' '• Perbaikan bug dan peningkatan performa' > "$notes"
            echo "Catatan rilis tidak diubah: memakai teks umum."
          else
            echo "Memakai catatan rilis dari $notes."
          fi
          cat "$notes"

      - name: Download the signed AAB
        if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: topan-tracking-aab
          path: aab

      - name: Upload to Google Play
        if: steps.creds.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.topan.topan_tracking
          releaseFiles: aab/app-release.aab
          # Catatan rilis "Yang baru" diambil dari play/whatsnew/whatsnew-id.
          whatsNewDirectory: play/whatsnew
          # Ubah lewat Settings > Variables: PLAY_TRACK (production/internal/alpha/beta),
          # PLAY_RELEASE_STATUS (completed/draft/inProgress).
          tracks: ${{ vars.PLAY_TRACK || 'production' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}

      - name: Install the Google Play API client
        if: steps.creds.outputs.ready == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/play-client"
          "$RUNNER_TEMP/play-client/bin/pip" install google-api-python-client==2.202.0

      - name: Sync the store listing (judul & deskripsi)
        if: steps.creds.outputs.ready == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          "$RUNNER_TEMP/play-client/bin/python" -I scripts/play_listing.py \
            --package com.topan.topan_tracking --listing-dir play/listing

  publish-drive:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: topan-android-drive-release
      queue: max
      cancel-in-progress: false

    steps:
      - name: Check out the release script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the verified APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: topan-tracking-android
          path: apk

      - name: Install the Google Drive API client
        run: |
          python3 -m venv "$RUNNER_TEMP/drive-client"
          "$RUNNER_TEMP/drive-client/bin/pip" install google-api-python-client==2.202.0

      - name: Update the Google Drive release file
        env:
          TOPAN_DRIVE_OAUTH: ${{ secrets.TOPAN_DRIVE_OAUTH }}
          TOPAN_DRIVE_FILE_ID: ${{ vars.TOPAN_DRIVE_FILE_ID }}
        run: |
          "$RUNNER_TEMP/drive-client/bin/python" scripts/drive_release.py publish \
            --apk apk/app-release.apk --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" --version-code "$GITHUB_RUN_NUMBER"

name: Publish Android test APK

on:
  push:
    branches:
      - release/android-apk-v1.0.0
    paths:
      - .github/workflows/publish-android-apk.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download and verify the existing APK
        run: |
          gh run download 45021180691 --name topan-tracking-android --dir apk
          test "$(gh run view 45021180691 --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = '934df7113486d72f3ca1f737bf0c0536f1698da9 success'
          test -s apk/app-release.apk

      - name: Publish the APK as a prerelease asset
        run: |
          gh release create android-v1.0.0-test.2 apk/app-release.apk \
            --target 934df7113486d72f3ca1f737bf0c0536f1698da9 \
            --title 'Topan Tracking 1.0.0 Android (uji coba)' \
            --notes 'Perbaikan peta Playback. APK dari GitHub Actions run #45021180691.' \
            --prerelease --latest=false

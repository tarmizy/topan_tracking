name: Publish Android test APK

on:
  push:
    branches:
      - release/android-apk-v1.0.0
    paths:
      - .github/workflows/publish-android-apk.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download and verify the existing APK
        run: |
          gh run download 45024735966 --name topan-tracking-android --dir apk
          test "$(gh run view 45024735966 --json headSha,conclusion --jq '.headSha + " " + .conclusion')" = '8e68136954b1cd645fb1be0520fceb111e1c4435 success'
          test -s apk/app-release.apk

      - name: Publish the APK as a prerelease asset
        run: |
          gh release create android-v1.0.0-test.3 apk/app-release.apk \
            --target 8e68136954b1cd645fb1be0520fceb111e1c4435 \
            --title 'Topan Tracking 1.0.0 Android (uji coba)' \
            --notes 'LocationIQ sebagai peta default Playback, perbaikan layar login ganda, simpan kredensial terenkripsi, dan nonaktifkan logout karena tidak aktif. APK dari GitHub Actions run #45024735966.' \
            --prerelease --latest=false
